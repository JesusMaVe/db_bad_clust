[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "db-bad-clust"
version = "0.1.0"
description = "Unsupervised detection of Oracle schema anti-patterns with sentence embeddings."
requires-python = ">=3.10"
# This branch IS the ML pipeline, so its dependencies are the base ones. The
# split that kept torch out of a base install belongs to the `rule-engine`
# branch, where a dependency-free audit path was the point; here there is no
# such path to protect. oracledb and pyyaml stay because notebook 01 and
# scripts/build_embeddings.py extract live metadata from Oracle.
dependencies = [
    "oracledb>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "umap-learn>=0.5.0",
    "hdbscan>=0.8.33",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.scripts]
db-bad-clust = "db_bad_clust.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "nbformat",
    "nbconvert",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "N802",  # function name should be lowercase (allow CamelCase for DDL/DML)
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
log_cli_level = "INFO"
pythonpath = ["src"]
